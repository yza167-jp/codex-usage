name: Consolidate v1.8.0 with current main
on:
  push:
    branches: [fix/v1.8.0-quota-calibration]
    paths: [.github/workflows/v180-consolidate.yml]
permissions:
  contents: write
jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify patch and reconcile upstream fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          import base64, hashlib, lzma, subprocess
          from pathlib import Path
          main = '127ebc9ba573509e3f9cc0629ab73cecf20418d8'
          actual = subprocess.check_output(['git','rev-parse','origin/main'],text=True).strip()
          assert actual == main, 'Main advanced again; reconcile rather than overwrite.'
          encoded = ''.join(Path(f'tools/v180-consolidated-{i}.b64').read_text().strip() for i in range(2))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          sha = hashlib.sha256(patch).hexdigest()
          assert sha == 'edac8473fc9108d05e62989d1857469a216b53e0bbb95799c2d6287149b74ae5', sha
          p=Path('/tmp/v180-consolidated.patch');p.write_bytes(patch)
          # Preserve the real upstream merge parent, and choose upstream's
          # implementation for overlapping files before adding tested hardening.
          result = subprocess.run(['git','merge','--no-commit','--no-ff',main])
          conflicts = set(subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).splitlines())
          common = ['CHANGELOG.md','README.md','README.zh-CN.md','codex-usage','tests/test_codex_usage.py','tests/test_gpt6.py']
          assert result.returncode in (0,1) and conflicts.issubset(set(common)), conflicts
          subprocess.run(['git','checkout',main,'--',*common],check=True)
          subprocess.run(['git','rm','--ignore-unmatch','docs/v1.8.0-quota-calibration.md','tests/test_quota_v180.py'],check=True)
          actual = subprocess.check_output(['git','hash-object','codex-usage'],text=True).strip()
          assert actual == '4a2db1413df63f52fc6568771724a004c70d675a', actual
          subprocess.run(['git','apply','--unidiff-zero','--check',str(p)],check=True)
          subprocess.run(['git','apply','--unidiff-zero',str(p)],check=True)
          expected = {
            'CHANGELOG.md': 'd6d2ba29f11396cef6c2e380752bd1442b04b34f04dd930ff06479eab4963f07',
            'README.md': '67ff684cc54a655350853aad712580c8806806bb767a1b37d3be017e69560190',
            'README.zh-CN.md': '1d8b725984e8e3e55d563c751eb6beddcc523670353a7030968edf3ecd2643e1',
            'codex-usage': '5d6f502c4b67bd7c40478fe602fa78a3d923678e503a595cacada633a84ec541',
            'docs/v1.8.0-quota-calibration.md': 'a43e22687b1e829986eb20f776d544616a15709f350e4ba2ed042936e6ac6148',
            'tests/test_codex_usage.py': 'edd7b56e5b7f6e21c4b7feeeb13bdbe3dcc4dd763744783ef6a9d2fba0b6b184',
            'tests/test_quota_scopes.py': 'f19c1eefd191053dfc9f037d79371b6c67289d7e262291653de26b3d39a9def3',
            'tests/test_quota_window.py': 'f897c8dcbb4ed3d43692b905a918e3412fd9bd6fdc21bda407292e7883bf8f16',
          }
          for name, sha in expected.items():
              got = hashlib.sha256(Path(name).read_bytes()).hexdigest()
              assert got == sha, (name,got,sha)
          subprocess.run(['git','rm','--ignore-unmatch', '.github/workflows/v180-reconcile-source.yml','.github/workflows/v180-consolidate.yml','tools/v180-consolidated-0.b64','tools/v180-consolidated-1.b64'],check=True)
          subprocess.run(['git','add',*expected],check=True)
          changed=set(subprocess.check_output(['git','diff','--cached','--name-only',main],text=True).splitlines())
          assert changed == set(expected), changed
          assert not subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).strip()
          print('Preserved upstream v1.7.4; verified all consolidated files and scope.')
          PY
      - name: Test consolidated source
        shell: bash
        run: |
          python -m py_compile codex-usage
          python -m unittest discover -s tests -v
          python codex-usage --version
          python codex-usage --help >/dev/null
          git diff --check --cached
      - name: Commit tested reconciliation
        shell: bash
        run: |
          git commit -m 'v1.8.0: consolidate v1.7.4 and harden quota scope migration'
          git push origin HEAD:fix/v1.8.0-quota-calibration
