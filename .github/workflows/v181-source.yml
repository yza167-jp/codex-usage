name: v1.8.1 source snapshot
on:
  push:
    branches: [fix/v1.8.1-gpt6-sol-luna]
    paths: [.github/workflows/v181-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8443c5123fba3281e4042d423f09bb417d7c43a0
      - run: git archive --format=tar HEAD > /tmp/v181-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: v181-source
          path: /tmp/v181-source.tar
          retention-days: 1
