name: v1.9.1 source snapshot
on:
  push:
    branches: [fix/v1.9.1-unified-sessions]
    paths: [.github/workflows/v191-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=tar HEAD > /tmp/v191-base.tar
      - uses: actions/upload-artifact@v4
        with:
          name: v191-base
          path: /tmp/v191-base.tar
          retention-days: 1
