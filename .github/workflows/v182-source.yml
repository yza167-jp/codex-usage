name: v1.8.2 source snapshot
on:
  push:
    branches: [fix/v1.8.2-gpt61-sol]
    paths: [.github/workflows/v182-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 525d5e51fbd996991425a868e81bf75006dee5a0
      - run: git archive --format=tar HEAD > /tmp/v182-base.tar
      - uses: actions/upload-artifact@v4
        with:
          name: v182-base
          path: /tmp/v182-base.tar
          retention-days: 1
