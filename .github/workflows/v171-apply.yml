name: Apply v1.7.1 model display fix
on:
  push:
    branches: [fix/v1.7.1-model-display]
    paths: [.github/workflows/v171-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ github.event.head_commit.message != 'Fix model label overflow in v1.7.1' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/v1.7.1-model-display
          fetch-depth: 0
      - name: Verify and apply tested display patch
        shell: bash
        run: |
          test "$(git hash-object codex-usage)" = 00f69bfeef7ad1d47b59e2b54973c3275ab6bb16
          echo 'd80386dd45a9780db9246e1a8b8551240aa89295f93fc82478bd04beea0f07c0  tools/v171-display.patch' | sha256sum -c -
          git apply --check tools/v171-display.patch
          git apply tools/v171-display.patch
      - name: Update bilingual usage notes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          updates = {
              'README.md': '''## v1.7.1: complete model lists without wider tables

          When `MODEL(S)` does not fit, the main row uses a complete first model plus
          the count of additional models (for example, `5.6 Sol +1`). An indented,
          dim `Models: 5.6 Sol / 6 Astra` continuation then lists every model. A
          fitting list stays inline, so ordinary single-model rows do not grow.
          Very long model identifiers and long lists wrap within the report width
          rather than losing their suffixes to an ellipsis. This applies to normal
          and `--wide` summaries and to model/agent details.

          The 144-cell cap, 34-cell wide SESSION column, numeric column alignment,
          accounting, JSON/CSV schemas and cache schema are unchanged. The `+N` in
          MODEL(S) counts additional models; it is not the incomplete-credit `+`.
          No new flag, cache rebuild, fee change or quota recalibration is required.

          ''',
              'README.zh-CN.md': '''## v1.7.1：完整显示模型列表

          `MODEL(S)` 放不下时，主行显示完整的首个模型及其余模型数量，例如
          `5.6 Sol +1`；紧接着以淡色缩进续行完整列出 `Models: 5.6 Sol / 6 Astra`。
          能放下的列表仍保持单行，单模型不会无故增加行数。超长模型 ID 和较多模型
          会在报告宽度内自动折行，不再用省略号吞掉后面的模型或标识后缀。
          普通摘要、`--wide`、模型详情和 agent 详情均适用。

          保留 144 格报告上限、宽屏 SESSION 的 34 格宽度和数字列对齐；统计、
          JSON/CSV 字段及 cache schema 均不改变。MODEL(S) 中的 `+N` 是其他模型
          的数量，与 CREDITS* 后表示未完整计价的 `+` 不同。无需新参数或重建缓存，
          也不修改费率和 weekly 校准。

          ''',
              'CHANGELOG.md': '''## 1.7.1 — 2026-09-05

          - Keep full model lists visible using automatic wrapped Models continuation lines instead of ellipsizing names in narrow MODEL(S) cells.
          - Use a complete first model plus an additional-model count, or a compact count when necessary; fitting model lists remain inline.
          - Apply the same display policy to normal/wide summaries, agent breakdowns and long model IDs in model breakdowns.
          - Preserve the 144-cell report cap, SESSION width, numeric alignment, all accounting/calibration code and JSON/CSV exports; no cache rebuild is needed.
          - Add regressions for many/long/CJK model names, mixed tiers, color, narrow/fullscreen layouts, detail tables and unchanged accounting outputs.

          ''',
          }
          for name, section in updates.items():
              p = Path(name)
              original = p.read_text(encoding='utf-8')
              title, rest = original.split('\n\n', 1)
              assert 'v1.7.1' not in original and '## 1.7.1' not in original
              p.write_text(title + '\n\n' + section + rest, encoding='utf-8')
          PY
      - name: Run all unit and CLI tests
        shell: bash
        run: |
          python -m py_compile codex-usage
          python -m unittest discover -s tests -v
          python codex-usage --version
          python codex-usage --help >/dev/null
          git diff --check
      - name: Commit production changes and remove temporary files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm tools/v171-display.patch .github/workflows/v171-apply.yml
          git add codex-usage tests/test_codex_usage.py tests/test_model_display.py README.md README.zh-CN.md CHANGELOG.md
          git commit -m 'Fix model label overflow in v1.7.1'
          git push origin HEAD:fix/v1.7.1-model-display
