name: Retry v1.6.2 readable-wide update

on:
  push:
    branches:
      - dev/v1.6.2-readable-wide

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[v162-applied]') && !contains(github.event.head_commit.message, '[v162-retry-error]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/v1.6.2-readable-wide
          fetch-depth: 0
      - name: Recover patcher, patch, test, and commit
        shell: bash
        run: |
          set +e
          git show bddbec163b74b9d7a8eb3216030a49ed91f8c79a:tools/apply_v162.py > /tmp/apply_v162.py
          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/apply_v162.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              "'help=\"Show INPUT/CACHED/OUTPUT columns in the summary table.\",'",
              "'help=\"Show INPUT/CACHED/OUTPUT columns in the summary table.\")'",
          )
          text = text.replace(
              "'help=\"Add a compact INPUT/CACHED/OUTPUT token triplet; narrow terminals use continuation lines.\",'",
              "'help=\"Add a compact INPUT/CACHED/OUTPUT token triplet; narrow terminals use continuation lines.\")'",
          )
          path.write_text(text, encoding='utf-8')
          PY

          {
            echo '== apply patch =='
            python /tmp/apply_v162.py
            patch_status=$?
            echo '== compile =='
            if [ "$patch_status" -eq 0 ]; then python -m py_compile codex-usage; else false; fi
            compile_status=$?
            echo '== tests =='
            if [ "$compile_status" -eq 0 ]; then python -m unittest -v tests/test_codex_usage.py; else false; fi
            test_status=$?
            echo '== smoke =='
            if [ "$test_status" -eq 0 ]; then python codex-usage --version && python codex-usage --help >/dev/null; else false; fi
            smoke_status=$?
          } > /tmp/v162-retry.log 2>&1
          status=$smoke_status
          cat /tmp/v162-retry.log

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/retry-v162.yml V162_ERROR.log V162_RETRY_ERROR.log

          if [ "$status" -eq 0 ]; then
            git add -A
            git commit -m 'Optimize project-aware wide summary [v162-applied]'
            git push origin HEAD:dev/v1.6.2-readable-wide
            exit 0
          fi

          cp /tmp/v162-retry.log V162_RETRY_ERROR.log
          git add -A
          git commit -m 'Record v1.6.2 retry error [v162-retry-error]'
          git push origin HEAD:dev/v1.6.2-readable-wide
          exit "$status"
