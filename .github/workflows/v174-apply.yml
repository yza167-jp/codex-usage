name: Apply v1.7.4 quota correction
on:
  push:
    branches: [fix/v1.7.4-current-quota]
    paths: [.github/workflows/v174-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/v1.7.4-current-quota
          fetch-depth: 0
      - name: Verify and apply locally tested source
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, json
          from pathlib import Path
          expected = [
              '184dd416bf574682e8a1976f914d101fd3cdb1ebb0496a9e3508493a9336f0cc',
              'd71493c1f262166820dd64aeaf38f79a3590fd0882c8d0c614a5e777cc2af878',
              'f4ab0809afe57e5447fc0ee616afbe58ef0bdf894d83148c9b4385a7566db28c',
              '1f0a81663a1910714d47b5fe62246ca3e48e3a8b6268f9ff25cf5f563448c6b3',
              '51cad14fddc2cdedfde6f7f08757787841210a336b79125eec3f3d503d866f87',
          ]
          parts = []
          for i in range(5):
              text = Path(f'tools/v174-part-{i}.b64').read_text(encoding='utf-8').strip()
              if i == 0:
                  text = text.replace('pdPTeKq0f', 'pdPTeK0f')
              digest = hashlib.sha256(text.encode()).hexdigest()
              assert digest == expected[i], (i, digest)
              parts.append(text)
          raw = gzip.decompress(base64.b64decode(''.join(parts), validate=True))
          assert hashlib.sha256(raw).hexdigest() == '7d086a82af074eb2c9cea7680d2209317344f1898d3252aaa8986dbc1796aee8'
          allowed = {'CHANGELOG.md', 'README.md', 'README.zh-CN.md', 'codex-usage',
                     'docs/v1.7.4-current-window-calibration.md',
                     'tests/test_codex_usage.py', 'tests/test_gpt6.py', 'tests/test_quota_window.py'}
          updates = {}
          for item in json.loads(raw):
              path = Path(item['path'])
              assert item['path'] in allowed
              text = path.read_text(encoding='utf-8') if path.exists() else ''
              assert hashlib.sha256(text.encode()).hexdigest() == item['before'], str(path)
              for a, b, replacement in reversed(item['edits']):
                  text = text[:a] + replacement + text[b:]
              assert hashlib.sha256(text.encode()).hexdigest() == item['after'], str(path)
              updates[path] = text
          assert set(map(str, updates)) == allowed
          for path, text in updates.items():
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(text, encoding='utf-8')
          assert hashlib.sha256(Path('codex-usage').read_bytes()).hexdigest() == '6431a5c87469d08f45adac8090f0f173572d7b47cea7076782dfdcd0460c93d2'
          print('Verified all source hashes; applied 8 files.')
          PY
      - name: Validate source
        run: |
          python -m py_compile codex-usage
          python -m unittest discover -s tests -v
          python codex-usage --version
          python codex-usage --help >/dev/null
          git diff --check
      - name: Commit tested source and remove transport helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/v174-source.yml .github/workflows/v174-apply.yml tools/v174-part-*.b64
          git add CHANGELOG.md README.md README.zh-CN.md codex-usage docs/v1.7.4-current-window-calibration.md tests/test_codex_usage.py tests/test_gpt6.py tests/test_quota_window.py
          git commit -m 'v1.7.4: repair current-window quota calibration'
          git push origin HEAD:fix/v1.7.4-current-quota
