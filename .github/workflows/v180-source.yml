name: v1.8.0 source snapshot
on:
  push:
    branches: [fix/v1.8.0-quota-calibration]
    paths: [.github/workflows/v180-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 2f131c450e004dc7cae59ecf6b1d1bbdcb2a11b0
      - run: git archive --format=tar HEAD > /tmp/codex-usage-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: v180-base-source
          path: /tmp/codex-usage-source.tar
          retention-days: 1
