name: Finalize v1.6.2

on:
  push:
    branches:
      - dev/v1.6.2-final

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/v1.6.2-final
          fetch-depth: 0
      - name: Apply and validate final patch
        shell: bash
        run: |
          set -euo pipefail
          python tools/fix_v162_tokens.py
          python -m py_compile codex-usage
          python -m unittest -v tests/test_codex_usage.py
          python codex-usage --version
          python codex-usage --help >/dev/null
      - name: Commit validated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/finalize-v162.yml tools/fix_v162_tokens.py
          git add -A
          git commit -m 'Finalize readable project-aware wide summary [v162-final]'
          git push origin HEAD:dev/v1.6.2-final
