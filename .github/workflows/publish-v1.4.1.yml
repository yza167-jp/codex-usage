name: Publish v1.4.1 UI polish

on:
  push:
    branches:
      - release/v1.4.1-ui-polish

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply semantic v1.4.1 patch to main
        shell: bash
        run: |
          cp .release/apply-v1.4.1.py /tmp/apply-v1.4.1.py
          git fetch origin main
          git checkout -B main origin/main
          python /tmp/apply-v1.4.1.py
          python -m unittest discover -s tests -v
          python codex-usage --version
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add codex-usage tests/test_codex_usage.py README.md README.zh-CN.md
          git commit -m 'Polish terminal UI for v1.4.1'
          git push origin HEAD:main

      - name: Remove helper branch
        if: success()
        shell: bash
        run: git push origin --delete release/v1.4.1-ui-polish
