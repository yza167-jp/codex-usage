name: Apply v1.7.3 model ordering
on:
  push:
    branches: [fix/v1.7.3-model-price-order]
    paths: [.github/workflows/v173-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/v1.7.3-model-price-order
          fetch-depth: 0
      - name: Apply exact locally tested source
        run: python tools/apply_v173.py
      - name: Validate source and full regression suite
        run: |
          python -m py_compile codex-usage
          python -m unittest discover -s tests -v
          python codex-usage --version
          python codex-usage --help > /dev/null
          git diff --check
      - name: Commit validated source and remove temporary tooling
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/v173-source.yml .github/workflows/v173-apply.yml tools/apply_v173.py
          git add codex-usage tests README.md README.zh-CN.md CHANGELOG.md
          git commit -m 'v1.7.3: highest-priced model first in every model list'
          git push origin HEAD:fix/v1.7.3-model-price-order
