name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit and CLI smoke tests
        run: python -m unittest discover -s tests -v
      - name: Check CLI help
        run: python codex-usage --help

      - name: Test Windows CMD launcher
        if: runner.os == 'Windows'
        shell: cmd
        run: codex-usage.cmd --version
      - name: Test Windows PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\install.ps1 -InstallDir "$env:RUNNER_TEMP\codex-usage-bin" -NoPath
          & "$env:RUNNER_TEMP\codex-usage-bin\codex-usage.cmd" --version
