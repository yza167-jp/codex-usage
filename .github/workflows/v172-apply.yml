name: Apply v1.7.2 project columns
on:
  push:
    branches: [fix/v1.7.2-project-column]
    paths: [.github/workflows/v172-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1.7.2-project-column
          fetch-depth: 0
      - name: Verify and apply locally tested source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, gzip, hashlib, subprocess
          from pathlib import Path
          source = Path('codex-usage').read_bytes()
          blob = hashlib.sha1(b'blob ' + str(len(source)).encode() + b'\0' + source).hexdigest()
          assert blob == '9f31b6e90cd1cebda95a8131c40df85f05f126a8', blob
          patch = gzip.decompress(base64.b64decode(Path('tools/v172.patch.b64').read_text(), validate=True))
          assert hashlib.sha256(patch).hexdigest() == '6b4d0618b3b38a7f869f38da12da4ef55c12dc428e4b3ae2a8b6029616756f1a'
          path = Path('/tmp/v172.patch')
          path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(path)], check=True)
          subprocess.run(['git', 'apply', str(path)], check=True)
          assert hashlib.sha256(Path('codex-usage').read_bytes()).hexdigest() == 'e3739e223724081a336e84adffface39bc4e08e37390dcfb1f0fae09f5d9d224'
          PY
      - name: Validate rendering and accounting regressions
        run: |
          python -m py_compile codex-usage
          python -m unittest discover -s tests -v
          python codex-usage --version
          python codex-usage --help
          git diff --check
      - name: Commit tested source and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm tools/v172.patch.b64 .github/workflows/v172-source.yml .github/workflows/v172-apply.yml
          git add codex-usage tests README.md README.zh-CN.md CHANGELOG.md
          git commit -m 'v1.7.2: separate project and session columns'
          git push origin HEAD:fix/v1.7.2-project-column
