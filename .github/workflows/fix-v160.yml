name: Fix and validate v1.6.0 branch

on:
  push:
    branches:
      - dev/v1.6.0-fast-aware

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[v160-fix-ok]') && !contains(github.event.head_commit.message, '[v160-fix-failed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/v1.6.0-fast-aware
          fetch-depth: 0
      - name: Repair escaped newline and validate
        shell: bash
        run: |
          set +e
          python - <<'PY'
          from pathlib import Path
          p = Path('codex-usage')
          s = p.read_text(encoding='utf-8')
          bad = 'if not raw.endswith(b"' + '\n' + '"):'
          good = 'if not raw.endswith(b"\\n"):'
          if bad not in s:
              raise SystemExit('broken newline anchor not found')
          p.write_text(s.replace(bad, good, 1), encoding='utf-8')
          PY
          repair_status=$?
          {
            echo '== script compile =='
            if [ "$repair_status" -eq 0 ]; then python -m py_compile codex-usage; else false; fi
            compile_status=$?
            if [ "$compile_status" -eq 0 ]; then
              echo '== unit tests =='
              python -m unittest -v tests/test_codex_usage.py
              test_status=$?
            else
              test_status=$compile_status
            fi
            if [ "$test_status" -eq 0 ]; then
              echo '== CLI smoke =='
              python codex-usage --version
              python codex-usage --help >/dev/null
              smoke_status=$?
            else
              smoke_status=$test_status
            fi
          } > /tmp/v160-fix.log 2>&1
          status=$smoke_status
          cat /tmp/v160-fix.log

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/fix-v160.yml
          if [ "$status" -eq 0 ]; then
            rm -rf tools/v160_patch
            rm -f V160_FAILURE.log
            git add -A
            git commit -m 'Validate tier-aware Fast accounting [v160-fix-ok]'
            git push origin HEAD:dev/v1.6.0-fast-aware
            exit 0
          fi
          cp /tmp/v160-fix.log V160_FAILURE.log
          git add -A
          git commit -m 'Record v1.6.0 validation failure [v160-fix-failed]'
          git push origin HEAD:dev/v1.6.0-fast-aware
          exit "$status"
