name: Apply v1.9.1 unified display
on:
  push:
    branches: [fix/v1.9.1-unified-sessions]
    paths: [.github/workflows/v191-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1.9.1-unified-sessions
          fetch-depth: 0
      - name: Apply display changes and run tests
        run: |
          python tools/apply_v191.py
          python -m py_compile codex-usage
          python -m unittest discover -s tests -v
          python codex-usage --version
          python codex-usage --help
          rm tools/apply_v191.py tools/v191_display_helpers.py .github/workflows/v191-source.yml .github/workflows/v191-apply.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add codex-usage README.md README.zh-CN.md CHANGELOG.md docs tests tools .github/workflows
          git commit -m 'v1.9.1: unify local and Cloud session display without mixing usage scopes'
          git push origin HEAD:fix/v1.9.1-unified-sessions
