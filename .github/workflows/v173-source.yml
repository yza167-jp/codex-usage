name: v1.7.3 source snapshot
on:
  push:
    branches: [fix/v1.7.3-model-price-order]
    paths: [.github/workflows/v173-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: c49aa2c6fc4cb1852651766a3cfbb99fabad642f
      - run: git archive --format=tar HEAD > /tmp/codex-usage-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: v173-base-source
          path: /tmp/codex-usage-source.tar
          retention-days: 1
