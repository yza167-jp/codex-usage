name: Apply v1.6.1 session labels

on:
  push:
    branches:
      - dev/v1.6.1-session-labels

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[v161-applied]') && !contains(github.event.head_commit.message, '[v161-failed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/v1.6.1-session-labels
          fetch-depth: 0
      - name: Apply patch and validate
        shell: bash
        run: |
          set +e
          {
            echo '== apply patch =='
            python tools/apply_v161.py
            patch_status=$?
            echo '== compile =='
            if [ "$patch_status" -eq 0 ]; then python -m py_compile codex-usage; else false; fi
            compile_status=$?
            echo '== unit tests =='
            if [ "$compile_status" -eq 0 ]; then python -m unittest -v tests/test_codex_usage.py; else false; fi
            test_status=$?
            echo '== CLI smoke =='
            if [ "$test_status" -eq 0 ]; then python codex-usage --version && python codex-usage --help >/dev/null; else false; fi
            smoke_status=$?
          } > /tmp/v161.log 2>&1
          status=$smoke_status
          cat /tmp/v161.log

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/apply-v1.6.1.yml tools/apply_v161.py

          if [ "$status" -eq 0 ]; then
            rm -f V161_FAILURE.log
            git add -A
            git commit -m 'Add project-aware session labels [v161-applied]'
            git push origin HEAD:dev/v1.6.1-session-labels
            exit 0
          fi

          cp /tmp/v161.log V161_FAILURE.log
          git add -A
          git commit -m 'Record v1.6.1 patch failure [v161-failed]'
          git push origin HEAD:dev/v1.6.1-session-labels
          exit "$status"
