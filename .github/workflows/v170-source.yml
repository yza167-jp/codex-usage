name: v1.7 source snapshot
on:
  push:
    branches: [dev/v1.7.0-gpt6]
    paths: [.github/workflows/v170-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ba759735ae27136c235bce198fa9b6ffe6277571
      - run: git archive --format=tar HEAD > /tmp/codex-usage-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: v170-base-source
          path: /tmp/codex-usage-source.tar
          retention-days: 1
